<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b" />
      <stop offset="50%" stop-color="#1c2541" />
      <stop offset="100%" stop-color="#3a506b" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4cc9f0" />
      <stop offset="50%" stop-color="#4895ef" />
      <stop offset="100%" stop-color="#7209b7" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Pulse Filter -->
    <filter id="subtleGlow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .title {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 800;
      font-size: 50px;
      fill: #ffffff;
      letter-spacing: 1px;
    }
    .subtitle {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #4cc9f0;
      letter-spacing: 0.5px;
    }
    .badge-text {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e0e1dd;
    }
    
    /* CSS Animations for Dynamic Dynamic Aspects */
    @keyframes pulseNode {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.25); opacity: 1; filter: drop-shadow(0 0 10px #4cc9f0); }
    }
    @keyframes dashStream {
      to { stroke-dashoffset: -60; }
    }
    @keyframes scanLine {
      0% { transform: translateY(0px); opacity: 0.2; }
      50% { opacity: 0.7; }
      100% { transform: translateY(340px); opacity: 0.2; }
    }
    @keyframes radarRotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .node-pulse {
      transform-box: fill-box;
      transform-origin: center;
      animation: pulseNode 3s infinite ease-in-out;
    }
    .node-pulse-delayed {
      transform-box: fill-box;
      transform-origin: center;
      animation: pulseNode 3s infinite ease-in-out 1.5s;
    }
    .stream-line {
      stroke-dasharray: 8 12;
      animation: dashStream 2s linear infinite;
    }
    .scan-line {
      animation: scanLine 6s linear infinite;
    }
    .radar-sweep {
      transform-box: fill-box;
      transform-origin: center;
      animation: radarRotate 10s linear infinite;
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="340" rx="16" fill="url(#bgGrad)" />

  <!-- Background Grid & Dynamic Tech Elements -->
  <g opacity="0.12">
    <path d="M 0 40 L 1200 40 M 0 80 L 1200 80 M 0 120 L 1200 120 M 0 160 L 1200 160 M 0 200 L 1200 200 M 0 240 L 1200 240 M 0 280 L 1200 280" stroke="#ffffff" stroke-width="1" />
    <path d="M 100 0 L 100 340 M 200 0 L 200 340 M 300 0 L 300 340 M 400 0 L 400 340 M 500 0 L 500 340 M 600 0 L 600 340 M 700 0 L 700 340 M 800 0 L 800 340 M 900 0 L 900 340 M 1000 0 L 1000 340 M 1100 0 L 1100 340" stroke="#ffffff" stroke-width="1" />
  </g>

  <!-- Animated Data Flow Lines (Background Network) -->
  <g opacity="0.35">
    <path d="M 50 280 Q 250 320 450 250 T 850 280 T 1150 220" fill="none" stroke="#4895ef" stroke-width="2" class="stream-line" />
    <path d="M 100 60 Q 350 20 600 80 T 1100 50" fill="none" stroke="#4cc9f0" stroke-width="1.5" class="stream-line" />
  </g>

  <!-- Right Decorative Graph Nodes (Dynamic Animated Background Graphic) -->
  <g transform="translate(860, 40)" opacity="0.6">
    <!-- Radar Sweep Effect -->
    <circle cx="180" cy="130" r="110" fill="none" stroke="#4cc9f0" stroke-width="1" stroke-dasharray="4 4" opacity="0.4" />
    <circle cx="180" cy="130" r="70" fill="none" stroke="#4895ef" stroke-width="1" opacity="0.3" />
    <g class="radar-sweep">
      <path d="M 180 130 L 290 130 A 110 110 0 0 0 180 20 Z" fill="url(#accentGrad)" opacity="0.15" />
    </g>

    <!-- Connecting Edges -->
    <line x1="80" y1="60" x2="180" y2="130" stroke="#4cc9f0" stroke-width="2" />
    <line x1="180" y1="130" x2="270" y2="70" stroke="#4895ef" stroke-width="2" />
    <line x1="180" y1="130" x2="250" y2="200" stroke="#7209b7" stroke-width="2" />
    <line x1="180" y1="130" x2="100" y2="190" stroke="#4cc9f0" stroke-width="2" />

    <!-- Pulse Nodes -->
    <circle cx="180" cy="130" r="14" fill="#4cc9f0" filter="url(#subtleGlow)" class="node-pulse" />
    <circle cx="80" cy="60" r="8" fill="#7209b7" class="node-pulse-delayed" />
    <circle cx="270" cy="70" r="10" fill="#4895ef" class="node-pulse" />
    <circle cx="250" cy="200" r="9" fill="#4cc9f0" class="node-pulse-delayed" />
    <circle cx="100" cy="190" r="7" fill="#7209b7" class="node-pulse" />
  </g>

  <!-- Left Dynamic Shield Icon (Foreground/Side graphic) -->
  <g transform="translate(60, 75)" filter="url(#glow)">
    <!-- Outer Shield Frame -->
    <path d="M 45 10 L 85 28 C 85 75 70 120 45 140 C 20 120 5 75 5 28 Z" fill="none" stroke="url(#accentGrad)" stroke-width="4" />
    <!-- Inner Shield Fill -->
    <path d="M 45 18 L 77 33 C 77 72 64 108 45 126 C 26 108 13 72 13 33 Z" fill="#1c2541" opacity="0.8" />
    <!-- Lock / Check Symbol -->
    <path d="M 32 68 L 42 78 L 60 55" fill="none" stroke="#4cc9f0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- FOREGROUND CONTENT (Guaranteed Unhidden & Clear) -->
  <g transform="translate(175, 115)">
    <!-- Header Title -->
    <text x="0" y="0" class="title" filter="url(#subtleGlow)">Awesome Anti-Money Laundering</text>
    
    <!-- Gradient Accent Line -->
    <rect x="0" y="15" width="620" height="4" rx="2" fill="url(#accentGrad)" />

    <!-- Subtitle -->
    <text x="0" y="52" class="subtitle">Curated Financial Crime Detection, Sanctions Screening &amp; Transaction Monitoring Ecosystem</text>

    <!-- Feature Pill Badges -->
    <g transform="translate(0, 80)">
      <!-- Badge 1: Real-Time TM -->
      <rect x="0" y="0" width="175" height="30" rx="15" fill="#1c2541" stroke="#4cc9f0" stroke-width="1.5" />
      <text x="87" y="19" text-anchor="middle" class="badge-text">⚡ Real-Time Monitoring</text>

      <!-- Badge 2: Sanctions & PEP -->
      <rect x="187" y="0" width="165" height="30" rx="15" fill="#1c2541" stroke="#4895ef" stroke-width="1.5" />
      <text x="269" y="19" text-anchor="middle" class="badge-text">🛡️ Sanctions &amp; PEP</text>

      <!-- Badge 3: Case Management -->
      <rect x="364" y="0" width="160" height="30" rx="15" fill="#1c2541" stroke="#7209b7" stroke-width="1.5" />
      <text x="444" y="19" text-anchor="middle" class="badge-text">🔍 Case Engine &amp; AI</text>
    </g>
  </g>

  <!-- Subtle Animated Scanning Line (Overlay effect across entire banner) -->
  <line x1="0" y1="0" x2="1200" y2="0" stroke="#4cc9f0" stroke-width="1.5" opacity="0.3" class="scan-line" />
</svg>
